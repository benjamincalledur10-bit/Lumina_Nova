plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        luminanova {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    if (providers.gradleProperty('withModMenu').getOrElse('false').toBoolean()) {
        runtimeOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    }
    compileOnly("maven.modrinth:sodium:${sodium_version}") { transitive = false }
    if (providers.gradleProperty('withIris').getOrElse('false').toBoolean()) {
        runtimeOnly("maven.modrinth:sodium:${sodium_version}") { transitive = false }
        runtimeOnly("maven.modrinth:iris:${iris_version}") { transitive = false }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.0'
}

sourceSets {
    test {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
    benchmark {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
    testmod {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}

loom {
    mods {
        luminanova_test { sourceSet sourceSets.testmod }
    }
    runs {
        frustumSmoke {
            client()
            source sourceSets.testmod
            runDir 'run-smoke'
            vmArg "-Dluminanova.smoke.fast=${providers.gradleProperty('fastFrustum').getOrElse('true')}"
            vmArg "-Dluminanova.smoke.enabled=${providers.gradleProperty('novaEnabled').getOrElse('true')}"
        }
        compatSmoke {
            client()
            source sourceSets.testmod
            runDir 'run-compat-smoke'
            vmArg '-Dluminanova.compatSmoke=true'
        }
        qualityWorld {
            client()
            source sourceSets.testmod
            runDir 'run-quality-world'
            vmArg '-Dfabric.client.gametest=true'
        }
        uiSmoke {
            client()
            source sourceSets.testmod
            runDir 'run-ui-smoke'
            vmArg '-Dluminanova.uiSmoke=true'
        }
    }
}

tasks.register('prepareFrustumSmoke') {
    doLast {
        def config = file('run-smoke/config/luminanova.properties')
        config.parentFile.mkdirs()
        config.text = "enabled=${providers.gradleProperty('novaEnabled').getOrElse('true')}\n" +
                "fast_frustum=${providers.gradleProperty('fastFrustum').getOrElse('true')}\n"
    }
}
tasks.named('runFrustumSmoke') { dependsOn 'prepareFrustumSmoke' }

tasks.register('prepareCompatSmoke') {
    doLast {
        file('run-compat-smoke/config').mkdirs()
        file('run-compat-smoke/options.txt').text = 'onboardAccessibility:false\nguiScale:2\nlang:es_es\n'
        file('run-compat-smoke/config/luminanova.properties').text = 'enabled=true\nfast_frustum=false\nultra_optimization=false\n'
    }
}
tasks.named('runCompatSmoke') { dependsOn 'prepareCompatSmoke' }

tasks.register('prepareUiSmoke') {
    doLast {
        def runDirectory = file('run-ui-smoke')
        runDirectory.mkdirs()
        file('run-ui-smoke/options.txt').text = 'onboardAccessibility:false\nguiScale:2\nlang:es_es\n'
        def config = file('run-ui-smoke/config/luminanova.properties')
        config.parentFile.mkdirs()
        config.text = 'enabled=true\nfast_frustum=true\nultra_optimization=false\n'
        file('run-ui-smoke/config/luminanova-quality.properties').delete()
    }
}
tasks.named('runUiSmoke') { dependsOn 'prepareUiSmoke' }

dependencies {
    benchmarkImplementation 'org.openjdk.jmh:jmh-core:1.37'
    benchmarkAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

test { useJUnitPlatform() }

tasks.register('frustumBenchmark', JavaExec) {
    dependsOn benchmarkClasses
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    args 'FrustumBenchmark', '-rf', 'json', '-rff', 'build/frustum-benchmark.json'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'fabric_api_version', project.fabric_api_version
    filesMatching('fabric.mod.json') {
        expand version: project.version,
                loader_version: project.loader_version,
                fabric_api_version: project.fabric_api_version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
